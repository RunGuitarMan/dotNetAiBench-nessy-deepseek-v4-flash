services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: motiva
      POSTGRES_USER: motiva
      POSTGRES_PASSWORD: motiva
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motiva -d motiva"]
      interval: 2s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"

  motiva-api:
    build:
      context: .
      dockerfile: src/Motiva.Api/Dockerfile
    env_file: .env.example
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=motiva;Username=motiva;Password=motiva"
      ConnectionStrings__Valkey: "valkey:6379"
      Storage__Endpoint: "minio:9000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  motiva-worker:
    build:
      context: .
      dockerfile: src/Motiva.Worker/Dockerfile
    env_file: .env.example
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=motiva;Username=motiva;Password=motiva"
      ConnectionStrings__Valkey: "valkey:6379"
      Storage__Endpoint: "minio:9000"
    depends_on:
      postgres:
        condition: service_healthy