        resourceId: { type: integer }
        amount: { type: integer, minimum: 1 }
        purchaseSystemId: { type: integer }
    RatingView:
      type: object
      properties:
        limit: { type: integer }
        top:
          type: array
          items:
            type: object
            properties:
              masterId: { type: string }
              score: { type: integer }
              place: { type: integer }
        own:
          type: object
          properties:
            masterId: { type: string }
            score: { type: integer }
            place: { type: integer }
    StatementRequest:
      type: object
      required: [from, to]
      properties:
        employeeId: { type: integer, description: "админ: выбранный сотрудник или пусто (вся компания)" }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        resourceId: { type: integer, description: один ресурс или пусто (все) }
    StatementRef:
      type: object
      properties:
        id: { type: integer }
