      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ResultRow' } }
        nextCursor: { type: string, nullable: true }
    # ---------- Проблема ----------
    Problem:
      type: object
      required: [status, title, detail, code, traceId]
      properties:
        status: { type: integer, example: 409 }
        title: { type: string }
        detail: { type: string }
        code:
          type: string
          enum: [validation_error, not_found, forbidden, conflict, precondition_failed, precondition_required, gone, insufficient_funds, resource_unavailable, service_unavailable, internal]
        traceId: { type: string }
        instance: { type: string, nullable: true }
    # ---------- Сотрудники ----------
    Employee:
      type: object
      required: [id, masterId, isActive]
      properties:
        id: { type: integer, format: int64 }
        masterId: { type: integer, minimum: 1, maximum: 2147483647 }
        isActive: { type: boolean }
        tags: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
        etag: { type: string }
    EmployeeCreate:
      type: object
      required: [masterId, tags]
      properties:
        masterId: { type: integer, minimum: 1, maximum: 2147483647 }
        tags: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
    EmployeePatch:
      type: object
      properties:
        tags: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
        isActive: { type: boolean }
    # ---------- Интеграции ----------
    Integration:
      type: object
      required: [id, name, serviceSub, companyId]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, maxLength: 200 }
        serviceSub: { type: string, description: проверенный sub сервиса (actorType=service) }
        companyId: { type: string, format: uuid }
    IntegrationCreate:
      type: object
      required: [name, serviceSub]
      properties:
        name: { type: string, maxLength: 200 }
        serviceSub: { type: string, maxLength: 200 }
    IntegrationGrant:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [progress, accrual, spend] }
        campaignId: { type: integer, format: int64, nullable: true }
        resourceId: { type: integer, format: int64, nullable: true }
        purchaseSystemId: { type: integer, format: int64, nullable: true }
      description: >
        Сочетания полей по kind: progress — campaignId обязателен, resourceId/purchaseSystemId недопустимы;
        accrual — campaignId и resourceId обязательны, purchaseSystemId недопустим;
        spend — purchaseSystemId и resourceId обязательны, campaignId недопустим.
        Отсутствие области не означает wildcard.
    IntegrationGrantList:
      type: object
      required: [grants]
      properties:
        grants: { type: array, items: { $ref: '#/components/schemas/IntegrationGrant' } }
    # ---------- Ресурсы ----------
    Resource:
      type: object
      required: [id, code, name, status]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
        etag: { type: string }
    ResourceCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
    ResourcePatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        status: { type: string, enum: [active, archived] }
    # ---------- Кампании ----------
    Audience:
      type: object
      properties:
        any: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
        all: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
        none: { type: array, items: { type: string, pattern: '^[a-z0-9-]{1,32}$' } }
    Campaign:
      type: object
      required: [id, code, name, season, start, end, state]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        season: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        state: { type: string, enum: [draft, published, archived] }
        ownerEmployeeId: { type: integer, format: int64 }
        audience: { $ref: '#/components/schemas/Audience' }
        resources: { type: array, items: { $ref: '#/components/schemas/CampaignResource' } }
        etag: { type: string }
    CampaignResource:
      type: object
      required: [resourceId]
      properties:
        resourceId: { type: integer, format: int64 }
        allocationRequested: { type: boolean, description: "запрос на выделение бюджета по ресурсу (admin подтверждает отдельной операцией)" }
    CampaignCreate:
      type: object
      required: [code, name, season, start, end, audience]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        season: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        audience: { $ref: '#/components/schemas/Audience' }
        resources: { type: array, items: { $ref: '#/components/schemas/CampaignResource' } }
    CampaignPatch:
      type: object
      description: >
        До публикации (draft): code/name/description/season/start/end/audience/resources/ownerEmployeeId.
        После публикации: только name/description/audience (B09f). Сезон/сроки/ресурсы после публикации — 409.
        status — переход draft/published/archived. ownerEmployeeId только admin (B03).
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        season: { type: integer }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        audience: { $ref: '#/components/schemas/Audience' }
        resources: { type: array, items: { $ref: '#/components/schemas/CampaignResource' } }
        ownerEmployeeId: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [published, archived] }
    # ---------- Стримы / Задания / Вехи ----------
    Stream:
      type: object
      required: [id, code, name, campaignId, status]
      properties:
        id: { type: integer, format: int64 }
        campaignId: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        audience: { $ref: '#/components/schemas/Audience' }
        status: { type: string, enum: [active, archived] }
        etag: { type: string }
    StreamCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
    StreamPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        audience: { $ref: '#/components/schemas/Audience' }
        status: { type: string, enum: [archived] }
    RewardLine:
      type: object
      required: [resourceId, amount]
      properties:
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
    Task:
      type: object
      required: [id, code, name, streamId, goal, periodicity, streamPoints]
      properties:
        id: { type: integer, format: int64 }
        streamId: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        goal: { type: integer, minimum: 1, maximum: 1000000000 }
        periodicity: { type: string, enum: [day, month, quarter, halfyear, year] }
        streamPoints: { type: integer, minimum: 0, maximum: 1000000000 }
        audience: { $ref: '#/components/schemas/Audience' }
        rewards: { type: array, items: { $ref: '#/components/schemas/RewardLine' } }
        status: { type: string, enum: [active, archived] }
        etag: { type: string }
    TaskCreate:
      type: object
      required: [code, name, goal, periodicity, streamPoints]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        goal: { type: integer, minimum: 1, maximum: 1000000000 }
        periodicity: { type: string, enum: [day, month, quarter, halfyear, year] }
        streamPoints: { type: integer, minimum: 0, maximum: 1000000000 }
        audience: { $ref: '#/components/schemas/Audience' }
        rewards: { type: array, items: { $ref: '#/components/schemas/RewardLine' } }
    TaskPatch:
      type: object
      description: >
        До публикации изменяемо: name/description/goal/periodicity/streamPoints/audience/rewards.
        После публикации — только status (архив). Иные изменения после публикации — 409.
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        goal: { type: integer, minimum: 1, maximum: 1000000000 }
        periodicity: { type: string, enum: [day, month, quarter, halfyear, year] }
        streamPoints: { type: integer, minimum: 0, maximum: 1000000000 }
        audience: { $ref: '#/components/schemas/Audience' }
        rewards: { type: array, items: { $ref: '#/components/schemas/RewardLine' } }
        status: { type: string, enum: [archived] }
    Milestone:
      type: object
      required: [id, streamId, threshold, achievementId]
      properties:
        id: { type: integer, format: int64 }
        streamId: { type: integer, format: int64 }
        threshold: { type: integer, minimum: 1, maximum: 1000000000 }
        achievementId: { type: integer, format: int64 }
        etag: { type: string }
    MilestoneCreate:
      type: object
      required: [threshold, achievementId]
      properties:
        threshold: { type: integer, minimum: 1, maximum: 1000000000 }
        achievementId: { type: integer, format: int64 }
    MilestonePatch:
      type: object
      properties:
        threshold: { type: integer, minimum: 1, maximum: 1000000000 }
        achievementId: { type: integer, format: int64 }
    # ---------- Челленджи / Рейтинг ----------
    Challenge:
      type: object
      required: [id, streamId, start, end, state]
      properties:
        id: { type: integer, format: int64 }
        streamId: { type: integer, format: int64 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        state: { type: string, enum: [open, final] }
        etag: { type: string }
    ChallengeCreate:
      type: object
      required: [streamId, start, end]
      properties:
        streamId: { type: integer, format: int64 }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
    Leaderboard:
      type: object
      required: [limit, top, asOf]
      properties:
        limit: { type: integer, maximum: 100 }
        top: { type: array, items: { $ref: '#/components/schemas/RatingRow' } }
        asOf: { type: string, format: date-time }
    RatingRow:
      type: object
      required: [masterId, score, place]
      properties:
        masterId: { type: integer }
        score: { type: integer, format: int64, minimum: 0 }
        place: { type: integer, minimum: 1 }
    OwnRating:
      type: object
      required: [present]
      properties:
        present: { type: boolean, description: "false — у читателя нет события в интервале, места нет" }
        masterId: { type: integer, nullable: true }
        score: { type: integer, format: int64, nullable: true }
        place: { type: integer, minimum: 1, nullable: true }
    # ---------- Достижения ----------
    Achievement:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        etag: { type: string }
    AchievementCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AchievementPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
    AchievementGrant:
      type: object
      required: [employeeId, achievementId, season, grantedAt]
      properties:
        employeeId: { type: integer, format: int64 }
        achievementId: { type: integer, format: int64 }
        season: { type: integer }
        grantedAt: { type: string, format: date-time }
    # ---------- Бюджеты ----------
    Budget:
      type: object
      required: [campaignId, resourceId, remaining]
      properties:
        campaignId: { type: integer, format: int64 }
        resourceId: { type: integer, format: int64 }
        remaining: { type: integer, format: int64, minimum: 0, maximum: 1000000000000000 }
    BudgetAllocationRequest:
      type: object
      required: [resourceId, amount]
      properties:
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
    # ---------- Системы покупок ----------
    PurchaseSystem:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 200 }
        resources: { type: array, items: { type: integer, format: int64 } }
        etag: { type: string }
    PurchaseSystemCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    PurchaseSystemPatch:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    # ---------- Личные чтения ----------
    CatalogItem:
      type: object
      required: [campaignId, code, name, asOf]
      properties:
        campaignId: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        asOf: { type: string, format: date-time, description: "момент заполнения кеша каталога (T06/T09)" }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/CatalogTask' }
    CatalogTask:
      type: object
      required: [taskId, code, name, goal]
      properties:
        taskId: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
        goal: { type: integer }
    ProgressView:
      type: object
      required: [taskId, period, value, goal, completed]
      properties:
        taskId: { type: integer, format: int64 }
        period: { type: string }
        value: { type: integer, minimum: 0 }
        goal: { type: integer }
        completed: { type: boolean }
    StreamScoreView:
      type: object
      required: [streamId, season, points]
      properties:
        streamId: { type: integer, format: int64 }
        season: { type: integer }
        points: { type: integer, format: int64, minimum: 0 }
    RewardView:
      type: object
      required: [taskId, result]
      properties:
        taskId: { type: integer, format: int64 }
        result: { type: string, enum: [granted, declined, none] }
        lines:
          type: array
          items: { $ref: '#/components/schemas/RewardLine' }
        rejectReason: { type: string, nullable: true }
    ResultRow:
      type: object
      required: [masterId]
      properties:
        masterId: { type: integer }
        completedTasks: { type: integer }
        streamPoints: { type: integer, format: int64 }
    ExpensesView:
      type: object
      required: [byResource]
      properties:
        byResource:
          type: array
          items:
            type: object
            required: [resourceId, spent, budgetRemaining]
            properties:
              resourceId: { type: integer, format: int64 }
              spent: { type: integer, format: int64 }
              budgetRemaining: { type: integer, format: int64 }
    # ---------- Кошелёк / операции ----------
    Wallet:
      type: object
      required: [employeeId, balances]
      properties:
        employeeId: { type: integer, format: int64 }
        balances: { type: array, items: { $ref: '#/components/schemas/Balance' } }
    Balance:
      type: object
      required: [resourceId, code, balance]
      properties:
        resourceId: { type: integer, format: int64 }
        code: { type: string }
        balance: { type: integer, format: int64, minimum: 0, maximum: 1000000000000000 }
    Movement:
      type: object
      required: [id, operationId, resourceId, delta, balanceAfter, occurredAt, kind]
      properties:
        id: { type: integer, format: int64 }
        operationId: { type: integer, format: int64 }
        resourceId: { type: integer, format: int64 }
        delta: { type: integer, format: int64 }
        balanceAfter: { type: integer, format: int64, minimum: 0 }
        occurredAt: { type: string, format: date-time }
        kind: { type: string, enum: [budget_allocation, manual_accrual, task_reward, spend, accrual_cancellation, spend_refund] }
        campaignId: { type: integer, format: int64, nullable: true }
        originalOperationId: { type: integer, format: int64, nullable: true }
    Operation:
      type: object
      required: [id, kind, initiatorKey, result, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [budget_allocation, manual_accrual, task_reward, spend, accrual_cancellation, spend_refund] }
        initiatorKey: { type: string, description: "инициатор: 'user:{id}' либо 'service:{id}'" }
        sourceNo: { type: string, description: "бессрочный бизнес-номер источника (B24)" }
        basis: { type: string, nullable: true, description: "основание (обязательно для manual_accrual/accrual_cancellation/spend_refund)" }
        employeeId: { type: integer, format: int64, nullable: true }
        result: { type: string, enum: [posted, declined] }
        rejectReason: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        campaignId: { type: integer, format: int64, nullable: true }
        purchaseSystemId: { type: integer, format: int64, nullable: true }
        originalOperationId: { type: integer, format: int64, nullable: true }
        lines: { type: array, items: { $ref: '#/components/schemas/OperationLine' } }
    OperationLine:
      type: object
      required: [resourceId, amount]
      properties:
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1 }
    OperationOutcome:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: integer, format: int64 }
        status: { type: string, enum: [posted, declined] }
        rejectReason: { type: string, nullable: true }
    SpendRequest:
      type: object
      required: [resourceId, amount, purchaseSystemId, basis]
      properties:
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        purchaseSystemId: { type: integer, format: int64 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    ManualAccrualRequest:
      type: object
      required: [campaignId, employeeId, resourceId, amount, basis]
      properties:
        campaignId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    InternalSpendRequest:
      type: object
      required: [employeeId, resourceId, amount, purchaseSystemId, basis]
      properties:
        employeeId: { type: integer, format: int64, description: "получатель списания (указанный сотрудник)" }
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        purchaseSystemId: { type: integer, format: int64 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    InternalManualAccrualRequest:
      type: object
      required: [campaignId, employeeId, resourceId, amount, basis]
      properties:
        campaignId: { type: integer, format: int64 }
        employeeId: { type: integer, format: int64 }
        resourceId: { type: integer, format: int64 }
        amount: { type: integer, minimum: 1, maximum: 1000000000 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    AccrualCancellationRequest:
      type: object
      required: [originalOperationId, basis]
      properties:
        originalOperationId: { type: integer, format: int64 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    SpendRefundRequest:
      type: object
      required: [originalOperationId, basis]
      properties:
        originalOperationId: { type: integer, format: int64 }
        basis: { type: string, minLength: 1, maxLength: 2000 }
    InternalRefundRequest:
      type: object
      required: [basis]
      properties:
        basis: { type: string, minLength: 1, maxLength: 2000 }
    # ---------- Выписки ----------
    Statement:
      type: object
      required: [id, state]
      properties:
        id: { type: integer, format: int64 }
        state: { type: string, enum: [pending, forming, ready, error, deleted] }
        scope: { type: string, enum: [employee, company] }
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        resourceId: { type: integer, format: int64, nullable: true }
        etag: { type: string }
    StatementRequest:
      type: object
      required: [from, to]
      properties:
        employeeId: { type: integer, format: int64, description: "admin: выбранный сотрудник либо пусто (компания)" }
        from: { type: string, format: date-time, description: "интервал [from,to), UTC" }
        to: { type: string, format: date-time }
        resourceId: { type: integer, format: int64, nullable: true, description: "один ресурс либо пусто (все)" }
    DownloadLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
    # ---------- Аудит ----------
    AuditEntry:
      type: object
      required: [id, actor, target, action, occurredAt]
      properties:
        id: { type: integer, format: int64 }
        actor: { type: string }
        target: { type: string }
        action: { type: string, enum: [rights_change, settings_change, budget_allocation, owner_change, permission_change, correction] }
        occurredAt: { type: string, format: date-time }
        details:
          type: object
          description: "Структурированные поля изменения (например {field, from, to}); не свободный JSON произвольной формы."
          additionalProperties:
            type: string
    # ---------- События (интеграция) ----------
    ProgressEventRequest:
      type: object
      required: [employeeId, taskId, increase, sourceEventNo]
      properties:
        employeeId: { type: integer, format: int64 }
        taskId: { type: integer, format: int64 }
        increase: { type: integer, minimum: 1, maximum: 1000000000 }
        sourceEventNo: { type: string, maxLength: 100, description: "бессрочный бизнес-номер события (B16)" }
    EventResult:
      type: object
      required: [accepted, creditedIncrease]
      properties:
        accepted: { type: boolean }
        creditedIncrease: { type: integer, minimum: 0 }
        completed: { type: boolean }
        reward:
          type: object
          nullable: true
          properties:
            result: { type: string, enum: [granted, declined, none] }
            reason: { type: string, nullable: true }