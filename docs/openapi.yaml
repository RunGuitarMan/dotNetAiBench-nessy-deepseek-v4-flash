          items: { type: string }
        none:
          type: array
          items: { type: string }
    AccrualRequest:
      type: object
      required: [employeeId, resourceId, amount, reason]
      properties:
        employeeId: { type: integer }
        resourceId: { type: integer }
        amount: { type: integer, minimum: 1 }
        reason: { type: string }
    OperationResult:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [accepted, rejected] }
        operationId: { type: integer }
        reason: { type: string }
    ProgressView:
      type: object
      properties:
        taskId: { type: integer }
        period: { type: string }
        value: { type: integer }
        goal: { type: integer }
        completed: { type: boolean }
    StreamScoreView:
      type: object
      properties:
        streamId: { type: integer }
        season: { type: integer }
        points: { type: integer }
    AchievementView:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        season: { type: integer }
        grantedAt: { type: string, format: date-time }
    WalletView:
      type: object
      properties:
        balances:
          type: array
          items:
            type: object
            properties:
              resourceId: { type: integer }
              code: { type: string }
