      type: object
      properties:
        progress:
          type: array
          items: { type: integer, description: campaignId }
        accrual:
          type: array
          items:
            type: object
            properties:
              campaignId: { type: integer }
              resourceId: { type: integer }
        spend:
          type: array
          items:
            type: object
            properties:
              resourceId: { type: integer }
              purchaseSystemId: { type: integer }
