openapi: 3.0.3
info:
  title: Motiva API
  version: 2.1.0
  description: >
    API платформы мотивационных кампаний. /api/v1 — пользовательские и административные
    сценарии; /internal/v1 — интеграции (сервис). Авторизация — JWT (договор 03_AUTH.md):
    iss=motiva-benchmark, aud=motiva-api, HS256, claims companyId (UUID), actorType (user|service),
    masterId (Int32, user), role (Employee, Admin). Владелец кампании определяется записью, не ролью.
    Без action-путей: изменения настройки — PATCH/DELETE (If-Match/ETag), отмены/возвраты/выделения —
    отдельные ресурсы. Экономический отказ корректной операции — 201 с OperationOutcome.status=declined.
    Повторы: экономические операции используют бессрочный бизнес-номер источника (заголовок Idempotency-Key,
    область (company, initiator_key, kind, номер)); создание настроек — транспортный Idempotency-Key (>=24ч).
servers:
  - url: https://motiva.example.com
security:
  - bearerAuth: []

tags:
  - name: Employees
  - name: Integrations
  - name: Resources
  - name: Campaigns
  - name: Streams
  - name: Tasks
  - name: Milestones
  - name: Challenges
  - name: Achievements
  - name: Budgets
  - name: PurchaseSystems
  - name: Me
  - name: Wallet
  - name: Operations
  - name: Cancellations
  - name: Statements
  - name: Audit
  - name: Integration

paths:
  # ================= Сотрудники (admin) =================
  /api/v1/employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: Список сотрудников компании (admin)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/EmployeePageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Создать профиль сотрудника (admin, B01); создаётся ровно один кошелёк
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeCreate' }
      responses:
        '201': { $ref: '#/components/responses/EmployeeCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/employees/{employeeId}:
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Профиль сотрудника (admin)
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
      responses:
        '200': { $ref: '#/components/responses/EmployeeOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Employees]
      operationId: updateEmployee
      summary: Изменение тегов, статуса активности (admin, B01/B05). Назначение владельца — через кампанию.
      parameters:
        - { $ref: '#/components/parameters/EmployeeId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeePatch' }
      responses:
        '200': { $ref: '#/components/responses/EmployeeOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ================= Интеграции (admin) =================
  /api/v1/integrations:
    get:
      tags: [Integrations]
      operationId: listIntegrations
      summary: Список интеграций компании (admin)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/IntegrationPageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Integrations]
      operationId: createIntegration
      summary: Зарегистрировать интеграцию (admin, B04/T03); связь с проверенным service sub и компанией
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationCreate' }
      responses:
        '201': { $ref: '#/components/responses/IntegrationCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/integrations/{integrationId}/grants:
    get:
      tags: [Integrations]
      operationId: listIntegrationGrants
      summary: Разрешения интеграции (admin, B04)
      parameters:
        - { $ref: '#/components/parameters/IntegrationId' }
      responses:
        '200': { $ref: '#/components/responses/IntegrationGrantPageResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Integrations]
      operationId: replaceIntegrationGrants
      summary: Замена разрешений интеграции (admin, B04); отзыв действует сразу
      parameters:
        - { $ref: '#/components/parameters/IntegrationId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntegrationGrantList' }
      responses:
        '200': { $ref: '#/components/responses/IntegrationGrantPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ================= Ресурсы (admin) =================
  /api/v1/resources:
    get:
      tags: [Resources]
      operationId: listResources
      summary: Список ресурсов компании (admin)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/ResourcePageResponse' }
    post:
      tags: [Resources]
      operationId: createResource
      summary: Создать ресурс (admin, B06)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourceCreate' }
      responses:
        '201': { $ref: '#/components/responses/ResourceCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/resources/{resourceId}:
    get:
      tags: [Resources]
      operationId: getResource
      summary: Ресурс (admin)
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
      responses:
        '200': { $ref: '#/components/responses/ResourceOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      operationId: updateResource
      summary: Изменение названия; архив (status=archived, необратимо) (B06/B07)
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResourcePatch' }
      responses:
        '200': { $ref: '#/components/responses/ResourceOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ================= Кампании =================
  /api/v1/campaigns:
    get:
      tags: [Campaigns]
      operationId: listCampaigns
      summary: "Кампании. Область выборки по роли: сотрудник — опубликованные текущего сезона; владелец/admin — свои черновики и исторические (query scope)."
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Season' }
        - { $ref: '#/components/parameters/CampaignScope' }
      responses:
        '200': { $ref: '#/components/responses/CampaignPageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Campaigns]
      operationId: createCampaign
      summary: Создать кампанию (черновик, admin/владелец, B08)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignCreate' }
      responses:
        '201': { $ref: '#/components/responses/CampaignCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/campaigns/{campaignId}:
    get:
      tags: [Campaigns]
      operationId: getCampaign
      summary: Детали кампании и стримов (в аудитории/владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
      responses:
        '200': { $ref: '#/components/responses/CampaignOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Campaigns]
      operationId: updateCampaign
      summary: Изменение настройки; публикация (status=published) и архив (status=archived) (B09). Поля делятся на до/после/никогда (§2).
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampaignPatch' }
      responses:
        '200': { $ref: '#/components/responses/CampaignOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Campaigns]
      operationId: deleteCampaignDraft
      summary: Удалить черновик (admin/владелец, B09i). Опубликованное нельзя. Черновик с проведёнными выделениями/аудитом удаляется логически (история сохраняется).
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Удалён черновик }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/campaigns/{campaignId}/streams:
    get:
      tags: [Campaigns]
      operationId: listStreams
      summary: Стримы кампании (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/StreamPageResponse' }
    post:
      tags: [Campaigns]
      operationId: createStream
      summary: Создать стрим (владелец/admin до публикации, B08)
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamCreate' }
      responses:
        '201': { $ref: '#/components/responses/StreamCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/campaigns/{campaignId}/budgets:
    get:
      tags: [Budgets]
      operationId: listBudgets
      summary: Бюджеты кампании по ресурсам (владелец/admin, B19). Список T04.
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/BudgetPageResponse' }
  /api/v1/campaigns/{campaignId}/budget-allocations:
    post:
      tags: [Budgets]
      operationId: allocateBudget
      summary: Выделение/увеличение бюджета по ресурсу (только admin, B18). Бизнес-номер источника обязателен.
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BudgetAllocationRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/campaigns/{campaignId}/results:
    get:
      tags: [Campaigns]
      operationId: getCampaignResults
      summary: Результаты кампании (владелец/admin, B34b). Не открывает полный кошелёк/посторонние покупки.
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/CampaignResultsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/campaigns/{campaignId}/expenses:
    get:
      tags: [Campaigns]
      operationId: getCampaignExpenses
      summary: Расходы своей кампании по ресурсам (владелец/admin, B34b/B35e)
      parameters:
        - { $ref: '#/components/parameters/CampaignId' }
      responses:
        '200': { $ref: '#/components/responses/ExpensesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ================= Стримы / Задания / Вехи =================
  /api/v1/streams/{streamId}:
    get:
      tags: [Streams]
      operationId: getStream
      summary: Стрим (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
      responses:
        '200': { $ref: '#/components/responses/StreamOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Streams]
      operationId: updateStream
      summary: Изменение названия/аудитории до публикации; архив (status=archived) (B09g)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamPatch' }
      responses:
        '200': { $ref: '#/components/responses/StreamOK' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/streams/{streamId}/tasks:
    get:
      tags: [Streams]
      operationId: listTasks
      summary: Задания стрима (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/TaskPageResponse' }
    post:
      tags: [Streams]
      operationId: createTask
      summary: Создать задание (владелец/admin до публикации, B12)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
      responses:
        '201': { $ref: '#/components/responses/TaskCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/tasks/{taskId}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Задание (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
      responses:
        '200': { $ref: '#/components/responses/TaskOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Настройка задания до публикации (цель, периодичность, очки, награды, аудитория); после публикации — только status (архив). (B09/B12)
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200': { $ref: '#/components/responses/TaskOK' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/streams/{streamId}/milestones:
    get:
      tags: [Milestones]
      operationId: listMilestones
      summary: Вехи стрима (владелец/admin, B29). Список T04.
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/MilestonePageResponse' }
    post:
      tags: [Milestones]
      operationId: createMilestone
      summary: Создать веху (владелец/admin до публикации, B29)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestoneCreate' }
      responses:
        '201': { $ref: '#/components/responses/MilestoneCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/milestones/{milestoneId}:
    get:
      tags: [Milestones]
      operationId: getMilestone
      summary: Веха (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/MilestoneId' }
      responses:
        '200': { $ref: '#/components/responses/MilestoneOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Milestones]
      operationId: updateMilestone
      summary: Изменение порога/достижения до публикации (B29)
      parameters:
        - { $ref: '#/components/parameters/MilestoneId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MilestonePatch' }
      responses:
        '200': { $ref: '#/components/responses/MilestoneOK' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
    delete:
      tags: [Milestones]
      operationId: deleteMilestone
      summary: Удалить веху до публикации (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/MilestoneId' }
        - { $ref: '#/components/parameters/IfMatch' }
      responses:
        '204': { description: Удалена }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ================= Челленджи / Рейтинг =================
  /api/v1/challenges:
    get:
      tags: [Challenges]
      operationId: listChallenges
      summary: Челленджи (владелец/admin)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/ChallengePageResponse' }
    post:
      tags: [Challenges]
      operationId: createChallenge
      summary: Создать челлендж по стриму (владелец/admin до публикации, B31)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChallengeCreate' }
      responses:
        '201': { $ref: '#/components/responses/ChallengeCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/challenges/{challengeId}:
    get:
      tags: [Challenges]
      operationId: getChallenge
      summary: Челлендж и его итог (владелец/admin/участник после сезона)
      parameters:
        - { $ref: '#/components/parameters/ChallengeId' }
      responses:
        '200': { $ref: '#/components/responses/ChallengeOK' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/challenges/{challengeId}/leaderboard:
    get:
      tags: [Challenges]
      operationId: getLeaderboard
      summary: Live-рейтинг top N (B32)
      parameters:
        - { $ref: '#/components/parameters/ChallengeId' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/LeaderboardOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/challenges/{challengeId}/own:
    get:
      tags: [Challenges]
      operationId: getOwnRating
      summary: Собственное место (отдельная операция, T04). Может отсутствовать у читателя без события.
      parameters:
        - { $ref: '#/components/parameters/ChallengeId' }
      responses:
        '200': { $ref: '#/components/responses/OwnRatingOK' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ================= Достижения =================
  /api/v1/achievements:
    get:
      tags: [Achievements]
      operationId: listAchievements
      summary: Определения достижений (admin)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/AchievementPageResponse' }
    post:
      tags: [Achievements]
      operationId: createAchievement
      summary: Создать определение достижения (admin, B29e/B30)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementCreate' }
      responses:
        '201': { $ref: '#/components/responses/AchievementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/achievements/{achievementId}:
    get:
      tags: [Achievements]
      operationId: getAchievement
      summary: Определение достижения (admin)
      parameters:
        - { $ref: '#/components/parameters/AchievementId' }
      responses:
        '200': { $ref: '#/components/responses/AchievementOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Achievements]
      operationId: updateAchievement
      summary: Изменение названия/описания (admin)
      parameters:
        - { $ref: '#/components/parameters/AchievementId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AchievementPatch' }
      responses:
        '200': { $ref: '#/components/responses/AchievementOK' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/achievement-grants:
    get:
      tags: [Achievements]
      operationId: listAchievementGrants
      summary: Выдачи достижений (сотрудник — свои; admin — компании, B30/B34a)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Season' }
        - { $ref: '#/components/parameters/EmployeeIdOptional' }
      responses:
        '200': { $ref: '#/components/responses/AchievementGrantPageResponse' }

  # ================= Системы покупок =================
  /api/v1/purchase-systems:
    get:
      tags: [PurchaseSystems]
      operationId: listPurchaseSystems
      summary: Системы покупок и принимаемые ресурсы (admin; сотрудник — доступные для траты)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/PurchaseSystemPageResponse' }
    post:
      tags: [PurchaseSystems]
      operationId: createPurchaseSystem
      summary: Создать систему покупок (admin, B23d)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseSystemCreate' }
      responses:
        '201': { $ref: '#/components/responses/PurchaseSystemCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/purchase-systems/{purchaseSystemId}:
    get:
      tags: [PurchaseSystems]
      operationId: getPurchaseSystem
      summary: Система покупок и принимаемые ресурсы (admin/сотрудник для выбора траты)
      parameters:
        - { $ref: '#/components/parameters/PurchaseSystemId' }
      responses:
        '200': { $ref: '#/components/responses/PurchaseSystemOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [PurchaseSystems]
      operationId: updatePurchaseSystem
      summary: Изменение названия (admin)
      parameters:
        - { $ref: '#/components/parameters/PurchaseSystemId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseSystemPatch' }
      responses:
        '200': { $ref: '#/components/responses/PurchaseSystemOK' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /api/v1/purchase-systems/{purchaseSystemId}/resources:
    put:
      tags: [PurchaseSystems]
      operationId: setPurchaseSystemResources
      summary: Принимаемые ресурсы системы покупок (admin, B23d)
      parameters:
        - { $ref: '#/components/parameters/PurchaseSystemId' }
        - { $ref: '#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { type: integer, format: int64 }
      responses:
        '200': { $ref: '#/components/responses/ResourceIdListOK' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  # ================= Личные чтения (сотрудник) =================
  /api/v1/me/catalog:
    get:
      tags: [Me]
      operationId: getMyCatalog
      summary: Доступные опубликованные кампании и задания текущего сезона (B11/B34). Фильтрация по актуальным правам/аудитории.
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/CatalogResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/progress:
    get:
      tags: [Me]
      operationId: getMyProgress
      summary: Мой прогресс по заданиям за период (B34a)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/TaskIdOptional' }
      responses:
        '200': { $ref: '#/components/responses/ProgressPageResponse' }
  /api/v1/me/streams/{streamId}/score:
    get:
      tags: [Me]
      operationId: getMyStreamScore
      summary: Мои очки стрима за сезон (B29/B34a)
      parameters:
        - { $ref: '#/components/parameters/StreamId' }
      responses:
        '200': { $ref: '#/components/responses/StreamScoreOK' }
  /api/v1/me/tasks/{taskId}/reward:
    get:
      tags: [Me]
      operationId: getMyReward
      summary: "Результат награждения по заданию (B34a): выданная награда, отсутствие награды, отказ с причиной."
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - { $ref: '#/components/parameters/Period' }
      responses:
        '200': { $ref: '#/components/responses/RewardOK' }

  # ================= Кошелёк (сотрудник) =================
  /api/v1/wallet:
    get:
      tags: [Wallet]
      operationId: getWallet
      summary: Баланс сотрудника по ресурсам (B22c)
      responses:
        '200': { $ref: '#/components/responses/WalletOK' }
  /api/v1/wallet/movements:
    get:
      tags: [Wallet]
      operationId: listWalletMovements
      summary: Движения кошелька (B28/B34d)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/ResourceFilter' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { $ref: '#/components/responses/MovementPageResponse' }
  /api/v1/wallet/operations:
    get:
      tags: [Wallet]
      operationId: listWalletOperations
      summary: История операций, включая отказы (B28)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { $ref: '#/components/responses/OperationPageResponse' }

  # ================= Операции / траты / отмены =================
  /api/v1/operations/{operationId}:
    get:
      tags: [Operations]
      operationId: getOperation
      summary: "Чтение операции по идентификатору/`Location` (B24/B28). Область: сотрудник — свои; admin — компании; владелец — своей кампании."
      parameters:
        - { $ref: '#/components/parameters/OperationId' }
      responses:
        '200': { $ref: '#/components/responses/OperationOK' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/spends:
    post:
      tags: [Operations]
      operationId: createSpend
      summary: Трата сотрудника из своего кошелька (B23). Бизнес-номер источника обязателен.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpendRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/manual-accruals:
    post:
      tags: [Operations]
      operationId: createManualAccrual
      summary: Ручное начисление одного ресурса активному участнику кампании (владелец своей кампании / admin; B21). Бизнес-номер источника обязателен.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualAccrualRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/accrual-cancellations:
    post:
      tags: [Cancellations]
      operationId: cancelAccrual
      summary: Отмена начисления/пакета награды (admin; владелец своей кампании при активном получателе; RA4 — только admin при заблокированном). B26.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccrualCancellationRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/spend-refunds:
    post:
      tags: [Cancellations]
      operationId: refundSpend
      summary: Возврат по трате (admin; та же система покупок с актуальным grant; B27). Причина обязательна.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SpendRefundRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================= Экспорт =================
  /api/v1/statements:
    post:
      tags: [Statements]
      operationId: createStatement
      summary: Заказать выписку (сотрудник; admin — сотрудника/компании; B35)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatementRequest' }
      responses:
        '201': { $ref: '#/components/responses/StatementCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Statements]
      operationId: listStatements
      summary: Мои выписки (сотрудник) или компании (admin, B35)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/StatementPageResponse' }
  /api/v1/statements/{statementId}:
    get:
      tags: [Statements]
      operationId: getStatement
      summary: Состояние выписки (заказчик, B36); state=deleted для удалённой
      parameters:
        - { $ref: '#/components/parameters/StatementId' }
      responses:
        '200': { $ref: '#/components/responses/StatementOK' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Statements]
      operationId: deleteStatement
      summary: Удалить выписку (заказчик, B37); не требует If-Match
      parameters:
        - { $ref: '#/components/parameters/StatementId' }
      responses:
        '204': { description: Удалена }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/statements/{statementId}/download-links:
    post:
      tags: [Statements]
      operationId: createDownloadLink
      summary: Выдать ссылку на готовую выписку (заказчик; срок <=60с, T05). Удалённая — 409 после проверки доступа.
      parameters:
        - { $ref: '#/components/parameters/StatementId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '201': { $ref: '#/components/responses/DownloadLinkCreated' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ================= Аудит (admin) =================
  /api/v1/audit:
    get:
      tags: [Audit]
      operationId: listAudit
      summary: История изменений прав/настроек/бюджета (admin, B28d)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { $ref: '#/components/responses/AuditPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ================= Интеграции (internal, service) =================
  /internal/v1/events:
    post:
      tags: [Integration]
      operationId: transmitProgress
      summary: Передать прогресс (сервис с grant progress; B14). business номер = sourceEventNo (B16).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressEventRequest' }
      responses:
        '201': { $ref: '#/components/responses/EventResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/spends:
    post:
      tags: [Integration]
      operationId: integrationSpend
      summary: Списание ресурса указанного сотрудника (сервис с grant spend; B23). Бизнес-номер источника обязателен.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalSpendRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/manual-accruals:
    post:
      tags: [Integration]
      operationId: integrationManualAccrual
      summary: Ручное начисление участнику (сервис с grant accrual; B21). Бизнес-номер источника обязателен.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalManualAccrualRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/spends/{operationId}/refund:
    post:
      tags: [Integration]
      operationId: integrationRefund
      summary: Возврат по своей трате (та же система покупок + актуальный grant; B27). Причина обязательна.
      parameters:
        - { $ref: '#/components/parameters/OperationId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalRefundRequest' }
      responses:
        '201': { $ref: '#/components/responses/OperationOutcome' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /internal/v1/operations:
    get:
      tags: [Integration]
      operationId: listIntegrationOperations
      summary: Только своя история операций (сервис; B04c)
      parameters:
        - { $ref: '#/components/parameters/PageCursor' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200': { $ref: '#/components/responses/OperationPageResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    EmployeeId: { name: employeeId, in: path, required: true, schema: { type: integer, format: int64 } }
    EmployeeIdOptional: { name: employeeId, in: query, required: false, schema: { type: integer, format: int64 } }
    TaskIdOptional: { name: taskId, in: query, required: false, schema: { type: integer, format: int64 } }
    ResourceId: { name: resourceId, in: path, required: true, schema: { type: integer, format: int64 } }
    CampaignId: { name: campaignId, in: path, required: true, schema: { type: integer, format: int64 } }
    StreamId: { name: streamId, in: path, required: true, schema: { type: integer, format: int64 } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: integer, format: int64 } }
    MilestoneId: { name: milestoneId, in: path, required: true, schema: { type: integer, format: int64 } }
    ChallengeId: { name: challengeId, in: path, required: true, schema: { type: integer, format: int64 } }
    AchievementId: { name: achievementId, in: path, required: true, schema: { type: integer, format: int64 } }
    IntegrationId: { name: integrationId, in: path, required: true, schema: { type: integer, format: int64 } }
    PurchaseSystemId: { name: purchaseSystemId, in: path, required: true, schema: { type: integer, format: int64 } }
    StatementId: { name: statementId, in: path, required: true, schema: { type: integer, format: int64 } }
    OperationId: { name: operationId, in: path, required: true, schema: { type: integer, format: int64 } }
    Season: { name: season, in: query, required: false, schema: { type: integer } }
    CampaignScope: { name: scope, in: query, required: false, schema: { type: string, enum: [available, mine, all] }, description: "available — опубликованные текущего сезона (сотрудник); mine — мои (владелец); all — компании (admin)" }
    Period: { name: period, in: query, required: false, schema: { type: string, enum: [day, month, quarter, halfyear, year] } }
    PageCursor: { name: cursor, in: query, required: false, schema: { type: string } }
    PageSize: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    ResourceFilter: { name: resource, in: query, required: false, schema: { type: integer, format: int64 } }
    From: { name: from, in: query, required: false, schema: { type: string, format: date-time } }
    To: { name: to, in: query, required: false, schema: { type: string, format: date-time } }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag (W/ не допускается)
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Для экономических операций (spend, manual-accrual, budget-allocation, cancellation, refund, event) — бессрочный
        бизнес-номер источника (B24/B16): область (company, initiator_key, kind, номер). Для создания настроек —
        транспортный ключ дедупликации >=24ч.
      schema: { type: string, maxLength: 100 }
  responses:
    BadRequest:
      description: Некорректные поля/диапазоны (400)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Неверный/отсутствующий JWT (401)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Недостаточно полномочий (403)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Чужой или недоступный объект (404)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Конфликт номера/состояния/одной отмены (409)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Временная недоступность (503); заголовок Retry-After
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: Устаревший ETag (412)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: Отсутствует If-Match (428)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Gone:
      description: Ресурс удалён (410)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

    # ---- 200 OK с ETag (изменяемые) ----
    EmployeeOK: { $ref: '#/components/responses/_OKEmployee' }
    ResourceOK: { $ref: '#/components/responses/_OKResource' }
    CampaignOK: { $ref: '#/components/responses/_OKCampaign' }
    StreamOK: { $ref: '#/components/responses/_OKStream' }
    TaskOK: { $ref: '#/components/responses/_OKTask' }
    MilestoneOK: { $ref: '#/components/responses/_OKMilestone' }
    ChallengeOK: { $ref: '#/components/responses/_OKChallenge' }
    AchievementOK: { $ref: '#/components/responses/_OKAchievement' }
    PurchaseSystemOK: { $ref: '#/components/responses/_OKPurchaseSystem' }
    OperationOK: { $ref: '#/components/responses/_OKOperation' }
    StatementOK: { $ref: '#/components/responses/_OKStatement' }
    WalletOK: { $ref: '#/components/responses/_OKWallet' }
    LeaderboardOK: { $ref: '#/components/responses/_OKLeaderboard' }
    OwnRatingOK: { $ref: '#/components/responses/_OKOwnRating' }
    StreamScoreOK: { $ref: '#/components/responses/_OKStreamScore' }
    RewardOK: { $ref: '#/components/responses/_OKReward' }
    ExpensesResponse: { $ref: '#/components/responses/_OKExpenses' }
    ResourceIdListOK: { $ref: '#/components/responses/_OKResourceIdList' }
    _OKEmployee:
      description: OK
      headers: { ETag: { schema: { type: string } } }
