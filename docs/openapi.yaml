        amount: { type: integer, minimum: 1 }
    InternalSpendRequest:
      type: object
      required: [employeeId, resourceId, amount, purchaseSystemId]
      properties:
        employeeId: { type: integer }
        resourceId: { type: integer }
        amount: { type: integer, minimum: 1 }
        purchaseSystemId: { type: integer }
    ExpensesView:
      type: object
      properties:
        byResource:
          type: array
          items:
            type: object
            properties:
              resourceId: { type: integer }
              spent: { type: integer }
              budgetRemaining: { type: integer }