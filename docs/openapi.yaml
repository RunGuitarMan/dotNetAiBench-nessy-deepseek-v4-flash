      type: object
      properties:
        id: { type: integer }
        masterId: { type: string }
        isActive: { type: boolean }
        tags:
          type: array
          items: { type: string }
    EmployeeUpsert:
      type: object
      required: [masterId, tags]
      properties:
        masterId: { type: string }
        tags:
          type: array
          items: { type: string }
    StatusUpdate:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
