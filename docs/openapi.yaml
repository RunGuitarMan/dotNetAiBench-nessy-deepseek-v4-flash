        streamPoints: { type: integer, minimum: 0, maximum: 1000000000 }
        audience: { $ref: '#/components/schemas/Audience' }
        rewards: { type: array, items: { $ref: '#/components/schemas/RewardLine' } }
        status: { type: string, enum: [active, archived] }
        etag: { type: string }
